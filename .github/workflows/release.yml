name: release

# Publishes a compiled homelab-deploy so pipelines can download it instead of
# building it. Push a tag like v0.1.0 on a main commit whose CI is green.
#
# - On a v* tag: builds, checks that CI passed for that exact commit, and
#   creates a GitHub release with the tarball and SHA256SUMS. Then the
#   `image` job (needs: release) builds the container image and pushes it
#   to ghcr.io. It is a job here, not a separate workflow, because a
#   release created with GITHUB_TOKEN does not trigger `release:` workflows.
# - On a PR touching this file or the Dockerfile: builds and verifies only
#   (binary and image). Nothing is published.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write is only exercised by the tag-only publish step;
    # actions: read lets the CI-gate step list workflow runs.
    permissions:
      contents: write
      actions: read
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'pr-test' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no build cache: release binaries come from a clean build

      - name: Require green CI on this commit (tags only)
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "$ok" -lt 1 ]; then
            echo "No successful CI run found for $GITHUB_SHA. Tag a commit whose CI is green." >&2
            exit 1
          fi
          echo "CI is green for $GITHUB_SHA"

      - name: Build linux/amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o dist/homelab-deploy .
          asset="homelab-deploy_${VERSION}_linux_amd64.tar.gz"
          tar -C dist -czf "$asset" homelab-deploy
          sha256sum "$asset" > SHA256SUMS
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          cat SHA256SUMS

      - name: Verify the artifact
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          mkdir -p verify
          tar -C verify -xzf "$ASSET"
          file verify/homelab-deploy || true
          # --help prints usage and exits 0 without needing terraform.
          ./verify/homelab-deploy --help > /dev/null 2>&1

      - name: Publish release (tags only)
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$ASSET" SHA256SUMS

  # Container image: Dockerfile builds the same binary from this commit,
  # on top of alpine with terraform (latest at build time), git and ssh.
  # Pushes to ghcr.io only for a v* tag, and only after `release` succeeded.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushing to ghcr.io; used only by the tag-only push step
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'pr-test' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the build context excludes secrets
        run: |
          set -euo pipefail
          # Plant decoys where a working tree could really have them (docker
          # ignore patterns match only at the root unless they start with
          # **/), then list what a COPY of the build context would contain.
          # The committed *.example templates are meant to be there.
          trap 'rm -rf .ctx-check .env' EXIT
          mkdir -p .ctx-check/svc/.terraform
          echo x > .env
          echo x > .ctx-check/svc/.env
          echo x > .ctx-check/svc/.env.prod
          echo x > .ctx-check/svc/terraform.tfstate
          echo x > .ctx-check/svc/terraform.tfstate.backup
          echo x > .ctx-check/svc/plan.tfplan
          echo x > .ctx-check/svc/.terraform/provider
          printf '%s\n' \
            'FROM alpine:3' \
            'COPY . /ctx' \
            'RUN test -f /ctx/go.mod || { echo "build context is empty: this check proves nothing" >&2; exit 1; }' \
            'RUN find /ctx \( -name ".env" -o -name ".env.*" -o -name "*.tfstate*" -o -name "*.tfplan" -o -name ".terraform" \) ! -name "*.example" > /leaks; if [ -s /leaks ]; then echo "secret-bearing files reached the build context:" >&2; cat /leaks >&2; exit 1; fi' \
            | docker build --no-cache -f - .

      - name: Build image
        run: |
          set -euo pipefail
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="${VERSION#v}"
          echo "IMAGE=ghcr.io/${repo}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          # --pull: always take the current base images, including terraform:latest.
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${tag}" \
            -t "ghcr.io/${repo}:${tag}" .

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          img="${IMAGE}:${TAG}"
          # --help prints usage and exits 0 without needing terraform.
          docker run --rm "$img" --help > /dev/null 2>&1
          docker run --rm --entrypoint terraform "$img" version
          docker run --rm --entrypoint git "$img" --version
          docker run --rm --entrypoint ssh "$img" -V
          uid="$(docker run --rm --entrypoint id "$img" -u)"
          [ "$uid" = "10001" ] || { echo "image runs as uid $uid, want 10001 (non-root)" >&2; exit 1; }

      - name: Push image (tags only)
        if: env.IS_TAG == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${TAG}"
          # A pre-release (v1.2.3-rc1) must not move `latest`.
          case "$TAG" in
            *-*) echo "pre-release: not tagging latest" ;;
            *)
              docker tag "${IMAGE}:${TAG}" "${IMAGE}:latest"
              docker push "${IMAGE}:latest"
              ;;
          esac
